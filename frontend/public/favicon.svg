<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- nose -->
  <polygon points="50,2 54,20 46,20" fill="#33ff00"/>
  <!-- fuselage body -->
  <rect x="45" y="18" width="10" height="44" rx="3" fill="#33ff00"/>
  <!-- swept main wings -->
  <polygon points="50,28 92,62 86,66 50,44 14,66 8,62" fill="#33ff00"/>
  <!-- wing leading edge detail -->
  <polygon points="50,28 92,62 88,62 50,32 12,62 8,62" fill="#1aaa00" opacity="0.5"/>
  <!-- twin tail booms -->
  <rect x="40" y="60" width="6" height="18" rx="2" fill="#33ff00"/>
  <rect x="54" y="60" width="6" height="18" rx="2" fill="#33ff00"/>
  <!-- horizontal stabilizers -->
  <polygon points="46,68 20,80 22,84 46,74" fill="#33ff00"/>
  <polygon points="54,68 80,80 78,84 54,74" fill="#33ff00"/>
  <!-- engine nozzles -->
  <ellipse cx="43" cy="79" rx="3.5" ry="2" fill="#0d2200"/>
  <ellipse cx="57" cy="79" rx="3.5" ry="2" fill="#0d2200"/>
  <!-- cockpit -->
  <ellipse cx="50" cy="26" rx="3" ry="5" fill="#0a0a0a" opacity="0.7"/>
  <ellipse cx="50" cy="25" rx="1.5" ry="3" fill="#66ffaa" opacity="0.4"/>
</svg>
